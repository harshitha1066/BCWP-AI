:root{--bg:#eef3f1;--card:#fff;--ink:#12262b;--mut:#5a6f73;--line:#d3dfdc;--acc:#1f6f8b;--g:#2e8b57;--a:#b07d05;--r:#c8402f;--gb:#e0f1e7;--ab:#fbf0d2;--rb:#f9e0dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0f1c1f;--card:#172a2e;--ink:#e6f0ee;--mut:#94adb0;--line:#284045;--acc:#5bb5d1;--g:#5fcf8d;--a:#e6b93c;--r:#ff7a68;--gb:#183a29;--ab:#3d3211;--rb:#48211c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'Atkinson Hyperlegible',system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--acc);color:#fff}
header h1{font-size:18px;margin:0}
header select,header button{font:inherit;padding:6px 8px;border-radius:8px;border:0}
.badge{font-size:13px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.22)}.badge.off{background:#c8402f}
nav{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
nav button{flex:1;padding:12px 4px;border:0;background:none;color:var(--mut);font:700 15px inherit;font-family:inherit;border-bottom:3px solid transparent}
nav button.on{color:var(--acc);border-color:var(--acc)}
main{max-width:760px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.st{border-left:8px solid var(--g)}.st.s1{border-color:var(--a)}.st.s2{border-color:var(--r)}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--gb);color:var(--g)}.s1 .pill{background:var(--ab);color:var(--a)}.s2 .pill{background:var(--rb);color:var(--r)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.banner{border-radius:12px;padding:14px;margin-bottom:12px;background:var(--gb)}.banner.bad{background:var(--rb)}
.banner b{display:block}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big button,.btn{font:700 17px inherit;font-family:inherit;padding:18px 8px;border-radius:12px;border:0;background:var(--acc);color:#fff}
.btn{padding:9px 14px;font-size:15px;background:var(--card);color:var(--acc);border:1px solid var(--acc)}
.big .off{background:var(--mut)}
label{display:block;font-size:14px;color:var(--mut);margin:8px 0 3px}
input,select{font:inherit;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);box-sizing:border-box}
small,.mut{color:var(--mut);font-size:14px}
.log div{padding:4px 0;border-bottom:1px solid var(--line);font-size:14px}
.cv{height:190px;position:relative}h2{font-size:17px;margin:4px 0 8px}
</style></head><body>

function status(lang){const l=lang||L(),c=S.cfg,n=now(),r=replay(n);let lv=r.lv,src=l.srcPred;
if(S.sensor&&n-S.sensor.t<.5*H){lv=S.sensor.p/100*c.cap;src=l.srcSensor}
const p=lv/c.cap,pct=Math.round(p*100),rate=c.flow-c.use/24;const etaMin=r.on&&rate>0?Math.round((c.cap*.95-lv)/rate*60):null;
let tk={s:0,m:tf(l.tkNormal,{pct,src}),eta:etaMin};
if(r.on&&p>=.95)tk={s:2,m:l.tkOverflow,eta:0};
else if(r.on&&etaMin!==null&&etaMin<=c.lead)tk={s:1,m:tf(l.tkPredict,{eta:Math.max(1,etaMin),flow:c.flow,cap:c.cap}),eta:etaMin};
else if(p>=.95)tk={s:1,m:l.tkStopped,eta:0};
const ll=S.light.filter(e=>e.t<=n).sort((a,b)=>a.t-b.t).pop(),lo=ll&&ll.on;
const p2=s=>+s.slice(0,2)*60+ +s.slice(3),mNow=new Date(n).getHours()*60+new Date(n).getMinutes(),offM=p2(c.lightOff),onM=p2(c.lightOn);
let nextT=offM>mNow?offM:(onM>mNow?onM:offM+1440),nextIsOff=nextT===offM||nextT===offM+1440,nextEta=nextT-mNow;
let li={s:0,m:lo?l.lightNight:l.lightDayOff,eta:nextEta};
if(lo&&isDay(n))li={s:2,m:l.lightDayOn,eta:0};
else if(lo&&nextIsOff&&nextEta<=c.lead)li={s:1,m:tf(l.lightPredict,{t:c.lightOff,eta:nextEta}),eta:nextEta};
const el=S.elec[S.elec.length-1];let ec={s:0,m:l.elecNone};
if(el){const ex=c.bill/30,dv=(el.u-ex)/ex,zz=z(el.u,S.elec.map(e=>e.u));ec={s:dv>.4?2:dv>.2||zz>2.5?1:0,m:tf(l.elecMsg,{u:el.u,ex:ex.toFixed(0),sign:dv>0?'+':'',pct:Math.round(dv*100)})}}
return{tank:tk,light:li,elec:ec,on:r.on,p,lo,el}}
function raise(kind,abn,auto,key,pred){if(S.alerts.some(a=>a.key===key))return;const l=L(),c=S.contacts.find(c=>c.asset.split(',').includes(kind)),k={tank:'tk',light:'lk',elec:'ek'}[kind],txt=(pred?l.predTag:'')+T[c.lang][k];
S.alerts.unshift({id:Date.now(),kind,key,t:Date.now(),ack:false,esc:false,to:c.name,roleKey:c.roleKey,lang:c.lang,abn,auto,pred});
S.sms.unshift(tf(l.smsLine,{time:hm(Date.now()),mode:off()?l.modeOff:l.modeLive,name:c.name,phone:c.phone,txt}));
act(tf(l.logAlertSent,{name:c.name,via:off()?l.viaOff:l.viaLive}));buzz();if(!off())speak(txt,c.lang)}
function speak(t,lg){try{const u=new SpeechSynthesisUtterance(t);u.lang={en:'en-IN',kn:'kn-IN',hi:'hi-IN'}[lg];speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function buzz(){try{navigator.vibrate&&navigator.vibrate([250,120,250,120,450])}catch(e){}}
function monitor(){const l=L(),n=now();let s=status();
if(s.tank.s===1)raise('tank',tf(l.abnTankPred,{eta:s.tank.eta}),l.autoTankPred,'tank:'+new Date(n).toDateString(),true);
if(s.on&&s.tank.s===2){S.pump.push({t:n,on:false,auto:1});act(l.logPumpAuto);raise('tank',l.abnTankNow,l.autoTankNow,'tank:'+new Date(n).toDateString())}
if(s.light.s===1)raise('light',tf(l.abnLightPred,{eta:s.light.eta}),l.autoLightPred,'light:'+new Date(n).toDateString(),true);
if(s.lo&&s.light.s===2){S.light.push({t:n,on:false,auto:1});act(l.logLightAuto);raise('light',l.abnLightNow,l.autoLightNow,'light:'+new Date(n).toDateString())}
if(s.elec.s===2)raise('elec',l.abnElec,l.autoElec,'elec:'+s.el.t);
const pc=S.contacts.find(c=>c.asset==='all');
S.alerts.forEach(a=>{if(!a.ack&&!a.esc&&Date.now()-a.t>S.cfg.esc*6e4){a.esc=true;const pl=T[pc.lang],tx=(a.pred?pl.predTag:'')+pl[{tank:'tk',light:'lk',elec:'ek'}[a.kind]];
S.sms.unshift(tf(pl.smsLine,{time:hm(Date.now()),mode:pl.modeOff,name:pc.name,phone:pc.phone,txt:tx}));act(tf(pl.logEscalated,{m:S.cfg.esc,name:pc.name}));if(!off())speak(tx,pc.lang)}});
S.alerts=S.alerts.slice(0,20);S.sms=S.sms.slice(0,8);save()}
function sim(){const l=L(),n=now();S.pump=[];S.light=[];S.elec=[];S.alerts=[];S.actions=[];S.sms=[];S.sensor=null;
for(let d=30;d>=1;d--){const a=new Date(n-d*D);a.setHours(6,0,0,0);const du=(1.3+Math.random()*.4)*H;S.pump.push({t:+a,on:true},{t:+a+du,on:false});
const o=new Date(n-d*D);o.setHours(18,30,0,0);const f=new Date(n-(d-1)*D);f.setHours(6,0,0,0);S.light.push({t:+o,on:true});if(+f<=n)S.light.push({t:+f,on:false});
const e=new Date(n-d*D);e.setHours(20,0,0,0);S.elec.push({t:+e,u:d===1?62:+(40+Math.random()*6-3).toFixed(1)})}
S.pump.push({t:n-3*H,on:true});S.light.push({t:n-25*6e4,on:true});act(l.logSimData);monitor();render()}
function op(k,on){const l=L(),n=now();S[k].push({t:n,on});if(off())S.pend++;act(tf(k==='pump'?l.logPumpLog:l.logLightLog,{state:on?l.stateOn:l.stateOff}));monitor();render()}
function cfg(k,v,num){S.cfg[k]=num?+v:v;save();if(k==='noon'||k==='lang')render();else monitor()}
function fo(){S.cfg.fo=!S.cfg.fo;net()}
function net(){const l=L(),o=off();$('#net').className='badge'+(o?' off':'');$('#net').textContent=o?l.offline:l.online;$('#fob').textContent=o?l.goOnline:l.testOffline;$('#ttl').textContent='💧 '+l.appName;if(!o&&S.pend){act(tf(l.logSyncedRecords,{n:S.pend}));S.pend=0;save()}}
addEventListener('online',()=>{net();render()});addEventListener('offline',()=>{net();render()});
function ack(id){const l=L(),a=S.alerts.find(a=>a.id===id);a.ack=true;act(tf(l.logAck,{name:a.to}));save();render()}
function say(id){const a=S.alerts.find(a=>a.id===id);const pl=T[a.lang];speak((a.pred?pl.predTag:'')+pl[{tank:'tk',light:'lk',elec:'ek'}[a.kind]],a.lang)}
const tabs=['home','op','vapp','hist','setup'];
function render(){charts.forEach(c=>c.destroy());charts=[];const l=L();$('#lg').value=S.cfg.lang;document.documentElement.lang=S.cfg.lang;
$('#nav').innerHTML=tabs.map(t=>'<button class="'+(t===tab?'on':'')+'" onclick="tab=\''+t+'\';render()">'+l[t]+'</button>').join('');
const v=$('#v');if(tab==='home')v.innerHTML=home();else if(tab==='op')v.innerHTML=opv();else if(tab==='vapp')v.innerHTML=vapp();else if(tab==='hist'){v.innerHTML=hist();drawH()}else v.innerHTML=setup();net();if(tab==='vapp')vSpeak()}
function home(){const l=L(),s=status(),w=['ok','warn','bad'];const open=S.alerts.find(a=>!a.ack);
const syncPart=S.cfg.synced?tf(l.syncedOn,{t:new Date(S.cfg.synced).toLocaleString()}):l.syncPending;
const mode=off()?'<div class="card"><b>'+l.offTitle+'</b><p>'+tf(l.offDesc,{sync:syncPart})+'</p></div>'
:'<div class="card"><b>'+l.liveTitle+'</b><p>'+l.liveDesc+'</p><button class="btn" onclick="S.cfg.synced=Date.now();act(L().logSynced);save();render()">'+l.syncBtn+'</button></div>';
const b=(open?'<div class="banner bad"><b>'+(open.pred?l.predSoon:l.abnNow)+': '+open.abn+'</b><b>'+l.sysResp+': '+open.auto+'</b><b>'+l.alerted+': '+open.to+(open.esc?l.escBanner:'')+'</b></div>':'<div class="banner"><b>'+l.allNormal+'</b></div>')+mode;
const cd=['tank','light','elec'].map(k=>'<div class="card st s'+s[k].s+'"><div class="row"><b>'+l[k]+'</b><span class="pill">'+l[w[s[k].s]]+'</span></div><div>'+s[k].m+'</div><small>'+l.updated+' '+hm(now())+'</small></div>').join('');
const al=S.alerts.map(a=>{const pl=T[a.lang];return '<div class="card"><div class="row"><b>'+l[a.kind]+'</b><small>'+hm(a.t)+' '+l.toWord+' '+a.to+(a.esc?l.escWord:'')+'</small></div><p>'+(a.pred?pl.predTag:'')+pl[{tank:'tk',light:'lk',elec:'ek'}[a.kind]]+'</p><div class="row"><button class="btn" onclick="say('+a.id+')">'+l.voice+'</button>'+(a.ack?'<small>'+l.ackedWord+'</small>':'<button class="btn" onclick="ack('+a.id+')">'+l.ack+'</button>')+'</div></div>'}).join('');
return b+cd+(S.pump.length?'':'<div class="card"><p>'+l.noData+'</p><button class="btn" onclick="sim()">'+l.sim+'</button></div>')+al+'<div class="card log"><h2>'+l.whatHappened+'</h2>'+(S.actions.map(a=>'<div>'+hm(a.t)+' '+a.m+'</div>').join('')||'<small>'+l.nothingYet+'</small>')+'<h2 style="margin-top:12px">'+l.smsLog+'</h2>'+(S.sms.map(a=>'<div>'+a+'</div>').join('')||'<small>'+l.none+'</small>')+'</div>'}
function opv(){const l=L();return'<div class="big"><button onclick="op(\'pump\',true)">'+l.pon+'</button><button class="off" onclick="op(\'pump\',false)">'+l.pof+'</button><button onclick="op(\'light\',true)">'+l.lon+'</button><button class="off" onclick="op(\'light\',false)">'+l.lof+'</button></div>'
+'<div class="card" style="margin-top:12px"><label>'+l.meterLabel+'</label><input id="mu" type="number" inputmode="decimal"><br><br><button class="btn" onclick="S.elec.push({t:now(),u:+$(\'#mu\').value});act(L().logMeter);monitor();render()">'+l.saveReading+'</button>'
+'<label>'+l.tankPctLabel+'</label><input id="sl" type="number" inputmode="numeric"><br><br><button class="btn" onclick="S.sensor={t:now(),p:+$(\'#sl\').value};act(L().logSensor);monitor();render()">'+l.sendSensor+'</button><p><small>'+l.sensorNote+'</small></p></div>'
+'<div class="card"><button class="btn" onclick="sim()">'+l.sim+'</button> <small>'+l.simNote+'</small></div>'}
function vlang(x){S.cfg.vlang=x;save();render()}
function vSpeak(){const open=S.alerts.find(a=>!a.ack);if(open&&S.vSeen!==open.id){S.vSeen=open.id;save();buzz();const pl=T[S.cfg.vlang];speak((open.pred?pl.predTag:'')+pl[{tank:'tk',light:'lk',elec:'ek'}[open.kind]],S.cfg.vlang)}}
function vapp(){const vl=T[S.cfg.vlang],s=status(),w=['ok','warn','bad'];const open=S.alerts.find(a=>!a.ack);
const langs=[['en','English'],['kn','ಕನ್ನಡ'],['hi','हिन्दी']].map(x=>'<button class="btn" style="'+(S.cfg.vlang===x[0]?'background:var(--acc);color:#fff':'')+'" onclick="vlang(\''+x[0]+'\')">'+x[1]+'</button>').join(' ');
const head='<div class="card"><h2>'+vl.vWelcome+'</h2><small>'+vl.vChoose+'</small><div class="row" style="margin-top:8px;flex-wrap:wrap">'+langs+'</div></div>';
const ask='<div class="card" style="text-align:center"><button onclick="vAsk()" style="width:100%;font:700 22px inherit;font-family:inherit;padding:24px 10px;border-radius:14px;border:0;color:#fff;background:'+(listening?'var(--r)':'var(--acc)')+'">'+(listening?('🎙️ '+vl.vListening):('🎤 '+vl.vAsk))+'</button><p class="mut" style="margin:10px 0 0">'+vl.vAskHint+'</p></div>';
let body;
if(open){const pl=T[S.cfg.vlang];body='<div class="banner bad"><b style="font-size:20px">'+vl.vNew+'</b><p style="font-size:18px">'+(open.pred?pl.predTag:'')+pl[{tank:'tk',light:'lk',elec:'ek'}[open.kind]]+'</p><p>'+vl.vAttn+'</p><div class="row"><button class="btn" onclick="speak((S.alerts[0].pred?T[S.cfg.vlang].predTag:\'\')+T[S.cfg.vlang][{tank:\'tk\',light:\'lk\',elec:\'ek\'}[S.alerts[0].kind]],S.cfg.vlang)">'+vl.vListen+'</button><button class="btn" onclick="ack('+open.id+')">'+vl.vGotIt+'</button></div></div>'}
else body='<div class="banner"><b style="font-size:20px">'+vl.vAllGood+'</b></div>';
const cd=['tank','light','elec'].map(k=>'<div class="card st s'+s[k].s+'"><div class="row"><b>'+vl[k]+'</b><span class="pill">'+vl[w[s[k].s]]+'</span></div></div>').join('');
return head+ask+body+cd}
function hist(){const l=L();return'<div class="row" style="margin-bottom:10px"><button class="btn" onclick="rng=7;render()">'+l.d7+'</button><button class="btn" onclick="rng=30;render()">'+l.d30+'</button></div>'+[['c1',l.chTank],['c2',l.chPump],['c3',l.chLight],['c4',l.chElec]].map(x=>'<div class="card"><h2>'+x[1]+'</h2><div class="cv"><canvas id="'+x[0]+'"></canvas></div></div>').join('')}
function hrs(ev,a,b){ev=[...ev].sort((x,y)=>x.t-y.t);let s=0,o=null;const ov=(x,y)=>Math.max(0,Math.min(y,b)-Math.max(x,a));for(const e of ev){if(e.on&&o===null)o=e.t;if(!e.on&&o!==null){s+=ov(o,e.t);o=null}}if(o!==null)s+=ov(o,now());return s/H}
function drawH(){const n=now(),cs=getComputedStyle(document.documentElement),ac=cs.getPropertyValue('--acc').trim(),rd=cs.getPropertyValue('--r').trim(),days=[...Array(rng).keys()].reverse().map(k=>{const d=new Date(n-k*D);d.setHours(0,0,0,0);return+d});
const lb=days.map(t=>new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short'}));
const mk=(id,type,labels,ds)=>charts.push(new Chart($('#'+id),{type,data:{labels,datasets:ds},options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:ds.length>1}},elements:{point:{radius:0}},scales:{x:{ticks:{maxTicksLimit:6}}}}}));
const sr=replay(n).ser.filter(p=>p.t>=n-rng*D);
mk('c1','line',sr.map(p=>new Date(p.t).toLocaleDateString(undefined,{day:'numeric',month:'short'})),[{data:sr.map(p=>Math.round(p.lv)),borderColor:ac,fill:false}]);
mk('c2','bar',lb,[{data:days.map(t=>+hrs(S.pump,t,t+D).toFixed(1)),backgroundColor:ac}]);
mk('c3','bar',lb,[{data:days.map(t=>+hrs(S.light,t,t+D).toFixed(1)),backgroundColor:ac}]);
const eu=days.map(t=>{const e=S.elec.filter(x=>x.t>=t&&x.t<t+D).pop();return e?e.u:null});
mk('c4','line',lb,[{label:'',data:eu,borderColor:ac,spanGaps:true},{label:'',data:days.map(()=>S.cfg.bill/30),borderColor:rd,borderDash:[5,4]}])}
function setup(){const l=L(),c=S.cfg,f=(k,lab,t,n)=>'<label>'+lab+'</label><input type="'+(t||'number')+'" value="'+c[k]+'" onchange="cfg(\''+k+'\',this.value,'+(n===0?'false':'true')+')">';
return'<div class="card"><h2>'+l.setupTitle+'</h2>'+f('cap',l.capLabel)+f('flow',l.flowLabel)+f('model',l.modelLabel,'text',0)+f('use',l.useLabel)+f('lightOn',l.lightOnLabel,'time',0)+f('lightOff',l.lightOffLabel,'time',0)+f('bill',l.billLabel)+f('esc',l.escLabel)+f('lead',l.leadLabel)+'<label><input type="checkbox" style="width:auto" '+(c.noon?'checked':'')+' onchange="cfg(\'noon\',this.checked)"> '+l.demoLabel+'</label></div>'
+'<div class="card"><h2>'+l.contactsTitle+'</h2>'+S.contacts.map((k,i)=>'<label>'+l[k.roleKey]+'</label><input value="'+k.name+'" onchange="S.contacts['+i+'].name=this.value;save()"><input value="'+k.phone+'" style="margin-top:4px" onchange="S.contacts['+i+'].phone=this.value;save()"><select style="margin-top:4px" onchange="S.contacts['+i+'].lang=this.value;save()">'+['en','kn','hi'].map(x=>'<option value="'+x+'" '+(k.lang===x?'selected':'')+'>'+{en:'English',kn:'ಕನ್ನಡ',hi:'हिन्दी'}[x]+'</option>').join('')+'</select>').join('')+'</div>'
+'<div class="card"><button class="btn" onclick="if(confirm(L().resetConfirm)){S=def();save();render()}">'+l.resetBtn+'</button></div>'}
render();setInterval(()=>{monitor();if(tab==='home')render()},60000);if(S.pump.length)monitor();
</script></body></html>
